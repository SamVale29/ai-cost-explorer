name: Pricing watch

on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.6.0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate catalog
        run: pnpm data:validate
      - name: Check benchmark contract
        run: pnpm benchmark:check-empty
      - name: Probe official source pages
        run: pnpm pricing:watch
      - name: Explain benchmark policy
        run: pnpm benchmark
