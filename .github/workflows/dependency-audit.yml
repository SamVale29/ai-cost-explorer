name: Dependency audit

on:
  schedule:
    - cron: '37 7 * * 0'
  workflow_dispatch:
  pull_request:
    paths:
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/dependency-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.6.0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify package signatures
        run: pnpm audit signatures
      - name: Audit production dependencies
        # The site uses declarative React Router only; it has no unstable RSC APIs.
        # Revisit this exception by 2026-09-01 and when the RSC fix is available.
        run: pnpm audit --prod --audit-level high --ignore GHSA-qwww-vcr4-c8h2
      - name: Informational audit without the documented exception
        run: pnpm audit --prod --audit-level high
        continue-on-error: true
