name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.6.0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Audit all dependencies
        run: pnpm audit --audit-level high
      - name: Verify package signatures
        run: pnpm audit signatures
      - name: Approve native build tools
        run: pnpm approve-builds esbuild sharp
        continue-on-error: true
      - name: Validate data
        run: pnpm data:validate
      - name: Check model coverage manifest
        run: pnpm data:check-model-coverage
      - name: Check benchmark contract
        run: pnpm benchmark:check-empty
      - name: Check source URLs
        run: pnpm data:check-sources
      - name: Typecheck
        run: pnpm typecheck
      - name: Format check
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser smoke tests
        run: pnpm test:e2e
